baseURL = "https://blog.iwindu.com/"
title = "iwindu"
pagination.pagerSize = 10
theme = "PaperMod"
languageCode = "zh-cn"
hasCJKLanguage = true

[params]
    env = "production"
    title = "iwindu"
    description = "Go开发者 | SSL证书 | FIDO | ACME协议研究"
    keywords = ["Go", "SSL", "FIDO", "ACME", "Tech Blog"]
    author = "iwindu"
    images = ["https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1200&q=80"]
    DateFormat = "2006-01-02"
    defaultTheme = "auto" 
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowWordCount = true
    UseHugoToc = true
    comments = false

[params.profileMode]
    enabled = true
    title = "iwindu"
    subtitle = "吹吹风，过过生活 | 专注于 Go 开发、SSL 证书与 FIDO 研究。"
    imageUrl = "https://images.unsplash.com/photo-1542831371-29b0f74f9713?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "iwindu"
    [[params.profileMode.buttons]]
        name = "浏览文章"
        url = "/posts"
    [[params.profileMode.buttons]]
        name = "GitHub"
        url = "https://github.com/go-goll"

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/go-goll"

[menu]
    [[menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts/"
        weight = 10
    [[menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
        weight = 20
    [[menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
        weight = 30
